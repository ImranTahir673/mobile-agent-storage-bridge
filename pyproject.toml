[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-agent-storage-bridge"
version = "0.7.0"
description = "Storage Copilot - Mobile Storage Bridge & Intelligent File Organizer"
authors = [
    { name = "Imran Tahir" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=2.0.0",
    "requests>=2.25.0",
    "waitress>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "scratch",
    "scripts",
    ".gemini",
    "web",
    "docs",
    "build",
    "dist"
]
